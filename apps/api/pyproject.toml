[project]
name = "ai-eval-canvas-api"
version = "0.1.0"
description = "AI Eval Canvas — FastAPI backend with LangGraph agents"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # LLM / Agent
    "openai>=1.30.0",          # Groq is OpenAI-compatible
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-text-splitters>=0.2.0",

    # Embeddings (local)
    "sentence-transformers>=3.0.0",

    # Vector store
    "chromadb>=0.5.0",

    # Database
    "supabase>=2.5.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",

    # Document parsing
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "html2text>=2024.2.26",
    "httpx>=0.27.0",

    # Utilities
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "B", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
