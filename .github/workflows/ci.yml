name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install uv
        run: pip install uv
        
      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --extra dev
        
      - name: Run Ruff Lint
        working-directory: apps/api
        run: uv run ruff check .
        
      - name: Run Mypy
        working-directory: apps/api
        run: uv run mypy .
        
      - name: Run Pytest
        working-directory: apps/api
        run: uv run pytest --cov=app --cov-report=xml

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Setup npm
        run: npm ci
        
      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint
        
      - name: Build Next.js
        working-directory: apps/web
        run: npm run build
